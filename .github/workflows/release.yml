name: Release

# Publishes the package to NuGet.org when a GitHub Release is published.
# Uses Trusted Publishing (OIDC) — no API key stored in secrets.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for OIDC / NuGet Trusted Publishing
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore StrongSort.slnx

      - name: Build
        run: dotnet build StrongSort.slnx -c Release --no-restore

      - name: Test
        run: dotnet test StrongSort.slnx -c Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack src/StrongSort/StrongSort.csproj -c Release --no-build -o ./artifacts

      - name: NuGet login (Trusted Publishing → temporary key)
        uses: NuGet/login@v1
        id: login
        with:
          user: buszek785   # NuGet.org account / owner name

      - name: Push
        run: >
          dotnet nuget push ./artifacts/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
